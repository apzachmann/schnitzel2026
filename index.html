          { id: 'q3', type: 'open', title: '3. Was unterscheidet einen Diakon primär von einem Pfarrer?', text: 'Hauptunterschied Diakon / Priester?', answer: 'Eine Weihestufe unter Priester; darf keine Eucharistie (Wandlung) feiern.', exp: 'Diakone dürfen taufen und trauen, aber keine Messe wandeln.' },
          { id: 'q4', type: 'open', title: '4. In welchem Bistum befindet sich unsere Pfarre?', text: 'Name unseres Bistums?', answer: 'Bistum Aachen (Bonus: Erzbistum Köln)', exp: 'Odenkirchen gehört zum Bistum Aachen.' },
          { id: 'q5', type: 'open', title: '5. Welcher Wortlaut steht auf unserem Logo?', text: 'Exakter Text des Logos?', answer: 'ACHTUNG MESSDIENER St. Laurentius Odenkirchen', exp: 'Aufdruck des offiziellen Gruppenlogos.' },
          { id: 'q6', type: 'open', title: '6. Was wird an Fronleichnam gefeiert?', text: 'Bedeutung von Fronleichnam?', answer: 'Wandlung des Brotes zum Leib Christi / Hochfest des Leibes und Blutes Christi.', exp: 'Feier der dauerhaften Gegenwart Jesu in der Eucharistie.' },
          { id: 'q7', type: 'open', title: '7. Wie nennen wir unseren Leiterraum auch?', text: 'Name des Leiterraums?', answer: 'Die Burg', exp: 'Die Burg ist der Treffpunkt der Leiter.' },
          { id: 'q8', type: 'open', title: '8. Wie heißt unsere Kantorin?', text: 'Name der Kantorin?', answer: 'Stephanie Borkenfeld-Müllers', exp: 'Leitet die Kirchenmusik & Gesang.' },
          { id: 'q9', type: 'open', title: '9. Wie werden die Teigblättchen genannt?', text: 'Name der Brotscheiben in der Messe?', answer: 'Hostien', exp: 'Hostien aus ungesäuertem Weizenbrot.' },
          { id: 'q10', type: 'open', title: '10. Erkennungsmerkmal des hl. St. Laurentius?', text: 'Welchen Gegenstand hält Laurentius in Abbildungen?', answer: 'Ein Rost', exp: 'Erlitt das Märtyrertum auf einem glühenden Eisenrost.' }
        ],
        postTaskTitle: "POSTENAUFGABE: MENSCHENPYRAMIDE",
        postTaskText: "Baut gemeinsam eine stabile Menschenpyramide auf! (0.0 bis 3.0 Punkte).",
        nextTaskText: "GLÜCKWUNSCH! Ihr habt alle 5 Posten der Schnitzeljagd 2026 erfolgreich absolviert!"
      }
    };

    let activeTab = 'p1';
    let selectedTeamForPosten = {};

    function loadData() {
      const stored = localStorage.getItem(DB_KEY);
      if (stored) {
        try { appData = JSON.parse(stored); } catch (e) {}
      }
      appData.teams.forEach(t => { if (!appData.scores[t]) appData.scores[t] = {}; });
    }

    function saveData() {
      localStorage.setItem(DB_KEY, JSON.stringify(appData));
    }

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.classList.remove('border-brand-gold', 'text-brand-gold', 'bg-brand-gold/20');
        btn.classList.add('border-transparent', 'text-gray-400');
      });
      const activeBtn = document.getElementById(`nav-${tabId}`);
      if (activeBtn) {
        activeBtn.classList.add('border-brand-gold', 'text-brand-gold', 'bg-brand-gold/20');
        activeBtn.classList.remove('border-transparent', 'text-gray-400');
      }
      render();
    }

    function render() {
      const container = document.getElementById('app-content');
      if (!container) return;

      if (activeTab === 'spielleiter') {
        renderSpielleiter(container);
      } else if (activeTab === 'sync') {
        renderSync(container);
      } else {
        renderPosten(container, activeTab);
      }
    }

    function renderPosten(container, pKey) {
      const pConfig = POSTEN_DATA[pKey];
      if (!selectedTeamForPosten[pKey] || !appData.teams.includes(selectedTeamForPosten[pKey])) {
        selectedTeamForPosten[pKey] = appData.teams[0] || '';
      }
      const currentTeam = selectedTeamForPosten[pKey];

      if (!currentTeam) {
        container.innerHTML = `
          <div class="glass-panel p-6 rounded-2xl text-center">
            <i class="fa-solid fa-triangle-exclamation text-brand-gold text-4xl mb-3"></i>
            <h2 class="text-xl font-bold">Keine Teams vorhanden!</h2>
            <p class="text-sm text-gray-300 mt-2">Bitte erstelle zuerst Teams im Bereich <strong class="text-brand-gold">Spielleiter</strong>.</p>
            <button onclick="switchTab('spielleiter')" class="mt-4 px-5 py-2.5 gold-gradient text-brand-dark font-bold rounded-xl">Zum Spielleiter</button>
          </div>
        `;
        return;
      }

      if (!appData.scores[currentTeam]) appData.scores[currentTeam] = {};
      if (!appData.scores[currentTeam][pKey]) appData.scores[currentTeam][pKey] = {};
      const teamScores = appData.scores[currentTeam][pKey];

      let html = `
        <div class="space-y-6">
          <div class="glass-panel p-5 rounded-2xl border-l-4 border-brand-gold">
            <h2 class="text-2xl font-black gold-text">${pConfig.title}</h2>
            <p class="text-xs text-gray-300 mt-1"><i class="fa-solid fa-box text-brand-gold"></i> <strong>Material:</strong> ${pConfig.material}</p>
          </div>

          <div class="bg-brand-green/80 p-3 rounded-2xl border border-brand-gold/30">
            <label class="text-xs font-bold text-brand-gold uppercase tracking-wider block mb-2"><i class="fa-solid fa-users"></i> Gruppe auswählen:</label>
            <div class="flex flex-wrap gap-2">
              ${appData.teams.map(t => `
                <button onclick="selectTeamForPosten('${pKey}', '${t}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all ${t === currentTeam ? 'gold-gradient text-brand-dark shadow-lg scale-105' : 'bg-brand-dark/60 text-gray-300 hover:bg-brand-dark'}">
                  ${t}
                </button>
              `).join('')}
            </div>
          </div>
      `;

      if (pConfig.hasPrevTask) {
        const val = teamScores.prevTask !== undefined ? teamScores.prevTask : 0;
        html += `
          <div class="glass-panel p-5 rounded-2xl border-l-4 border-amber-500">
            <h3 class="font-bold text-amber-400 text-base"><i class="fa-solid fa-truck-ramp-box"></i> ${pConfig.prevTaskTitle}</h3>
            <p class="text-xs text-gray-300 mt-1">${pConfig.prevTaskDesc}</p>
            <div class="mt-3 flex items-center gap-2">
              <span class="text-xs font-semibold text-gray-400">Punkte:</span>
              <div class="flex gap-1.5 flex-wrap">
                ${[0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0].map(v => `
                  <button onclick="setScore('${pKey}', 'prevTask',${v})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${val === v ? 'gold-gradient text-brand-dark' : 'bg-brand-dark/80 text-gray-300 hover:bg-brand-dark'}">
                    ${v.toFixed(1)} Pkt
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      html += `<div class="space-y-4">`;
      pConfig.questions.forEach((q) => {
        const val = teamScores[q.id];
        html += `
          <div class="glass-panel p-5 rounded-2xl">
            <h4 class="font-bold text-sm text-brand-gold mb-2">${q.title}</h4>
            <p class="text-sm font-medium mb-3 whitespace-pre-line">${q.text || ''}</p>
        `;

        if (q.type === 'mc') {
          html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">`;
          q.options.forEach(opt => {
            const letter = opt.charAt(0);
            let btnClass = "option-btn text-left p-2.5 rounded-xl text-xs font-medium bg-brand-dark/50 text-gray-200";
            if (val === letter) {
              btnClass += (letter === q.correct) ? " selected-correct" : " selected-wrong";
            }
            html += `
              <button onclick="setMcAnswer('${pKey}', '${q.id}', '${letter}', '${q.correct}')" class="${btnClass}">
                ${opt}
              </button>
            `;
          });
          html += `</div>`;
        } else {
          const curVal = val !== undefined ? val : null;
          html += `
            <div class="flex items-center gap-2 mb-3">
              <span class="text-xs text-gray-400">Bewertung:</span>
              <button onclick="setScore('${pKey}', '${q.id}', 0)" class="px-3 py-1.5 rounded-lg text-xs font-bold ${curVal === 0 ? 'bg-red-600 text-white' : 'bg-brand-dark/80 text-gray-300'}">0 Pkt</button>
              <button onclick="setScore('${pKey}', '${q.id}', 0.5)" class="px-3 py-1.5 rounded-lg text-xs font-bold ${curVal === 0.5 ? 'bg-amber-500 text-brand-dark' : 'bg-brand-dark/80 text-gray-300'}">0.5 Pkt</button>
              <button onclick="setScore('${pKey}', '${q.id}', 1.0)" class="px-3 py-1.5 rounded-lg text-xs font-bold ${curVal === 1.0 ? 'bg-emerald-600 text-white' : 'bg-brand-dark/80 text-gray-300'}">1.0 Pkt</button>
            </div>
          `;
        }

        html += `
            <details class="text-xs bg-brand-dark/40 rounded-xl p-2.5 border border-brand-gold/10">
              <summary class="cursor-pointer font-bold text-brand-gold/90"><i class="fa-solid fa-key"></i> Lösung & Erklärung einblenden</summary>
              <div class="mt-2 text-gray-300 space-y-1">
                ${q.answer ? `<p><strong class="text-emerald-400">Antwort:</strong> ${q.answer}</p>` : ''}
                ${q.correct ? `<p><strong class="text-emerald-400">Richtige Option:</strong> ${q.correct}</p>` : ''}
                <p><strong class="text-gray-400">Erklärung:</strong> ${q.exp}</p>
              </div>
            </details>
          </div>
        `;
      });
      html += `</div>`;

      const postVal = teamScores.postTask !== undefined ? teamScores.postTask : 0;
      html += `
        <div class="glass-panel p-5 rounded-2xl border-l-4 border-emerald-500">
          <h3 class="font-bold text-emerald-400 text-base"><i class="fa-solid fa-star"></i> ${pConfig.postTaskTitle}</h3>
          <p class="text-xs text-gray-300 mt-1">${pConfig.postTaskText}</p>
          <div class="mt-3 flex items-center gap-2">
            <span class="text-xs font-semibold text-gray-400">Punktevergabe:</span>
            <div class="flex gap-1.5 flex-wrap">
              ${[0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0].map(v => `
                <button onclick="setScore('${pKey}', 'postTask',${v})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${postVal === v ? 'gold-gradient text-brand-dark' : 'bg-brand-dark/80 text-gray-300 hover:bg-brand-dark'}">
                  ${v.toFixed(1)} Pkt
                </button>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="bg-cyan-950/80 border border-cyan-500/40 p-5 rounded-2xl text-cyan-200">
          <h4 class="font-bold text-sm text-cyan-300 flex items-center gap-2"><i class="fa-solid fa-circle-info"></i> Hinweiskasten: Aufgabe für den nächsten Posten</h4>
          <p class="text-xs mt-2 leading-relaxed">${pConfig.nextTaskText}</p>
        </div>
      </div>
      `;

      container.innerHTML = html;
    }

    function renderSpielleiter(container) {
      let html = `
        <div class="space-y-6">
          <div class="glass-panel p-5 rounded-2xl border-l-4 border-brand-gold flex justify-between items-center flex-wrap gap-4">
            <div>
              <h2 class="text-2xl font-black gold-text">Spielleiter – Zentrale</h2>
              <p class="text-xs text-gray-300 mt-1">Verwaltung aller Teams, Punkte-Auswertung und Gesamt-Rangliste.</p>
            </div>
            <div class="flex gap-2">
              <button onclick="openMergeModal()" class="px-3 py-2.5 bg-brand-accent hover:bg-brand-green text-white font-bold rounded-xl text-xs shadow-lg">
                <i class="fa-solid fa-object-ungroup"></i> Teams zusammenfassen
              </button>
              <button onclick="promptAddTeam()" class="px-4 py-2.5 gold-gradient text-brand-dark font-bold rounded-xl text-xs shadow-lg">
                <i class="fa-solid fa-plus"></i> Neues Team anlegen
              </button>
            </div>
          </div>

          <div class="glass-panel p-5 rounded-2xl">
            <h3 class="font-bold text-sm text-brand-gold mb-3"><i class="fa-solid fa-users-gear"></i> Registrierte Teams (${appData.teams.length})</h3>
            ${appData.teams.length === 0 ? '<p class="text-xs text-gray-400">Keine Teams vorhanden.</p>' : ''}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${appData.teams.map(t => `
                <div class="bg-brand-dark/70 p-3 rounded-xl border border-brand-gold/20 flex justify-between items-center">
                  <span class="font-bold text-sm">${t}</span>
                  <button onclick="confirmDeleteTeam('${t}')" class="text-red-400 hover:text-red-300 p-2 text-xs" title="Team löschen">
                    <i class="fa-solid fa-trash-can text-base"></i>
                  </button>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="glass-panel p-5 rounded-2xl">
            <h3 class="font-bold text-base text-brand-gold mb-4"><i class="fa-solid fa-trophy text-amber-400"></i> Gesamtwertung / Rangliste</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="border-b border-brand-gold/20 text-brand-gold uppercase tracking-wider">
                    <th class="py-2.5 px-2">Rang</th>
                    <th class="py-2.5 px-2">Team</th>
                    <th class="py-2.5 px-2 text-center">P1</th>
                    <th class="py-2.5 px-2 text-center">P2</th>
                    <th class="py-2.5 px-2 text-center">P3</th>
                    <th class="py-2.5 px-2 text-center">P4</th>
                    <th class="py-2.5 px-2 text-center">P5</th>
                    <th class="py-2.5 px-2 text-right">Gesamt</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-brand-gold/10">
      `;

      const leaderboard = appData.teams.map(team => {
        let total = 0;
        const postTotals = {};
        ['p1', 'p2', 'p3', 'p4', 'p5'].forEach(pKey => {
          let pSum = 0;
          const pScores = (appData.scores[team] && appData.scores[team][pKey]) ? appData.scores[team][pKey] : {};
          Object.keys(pScores).forEach(k => {
            if (k.startsWith('q')) {
              const qConf = POSTEN_DATA[pKey].questions.find(q => q.id === k);
              if (qConf && qConf.type === 'mc') {
                if (pScores[k] === qConf.correct) pSum += 1.0;
              } else if (typeof pScores[k] === 'number') {
                pSum += pScores[k];
              }
            } else if (typeof pScores[k] === 'number') {
              pSum += pScores[k];
            }
          });
          postTotals[pKey] = pSum;
          total += pSum;
        });
        return { team, total, postTotals };
      });

      leaderboard.sort((a, b) => b.total - a.total);

      leaderboard.forEach((item, idx) => {
        let badge = `<span class="font-bold text-gray-400">#${idx + 1}</span>`;
        if (idx === 0) badge = `<span class="text-amber-400 font-black text-sm"><i class="fa-solid fa-crown"></i> 1</span>`;
        if (idx === 1) badge = `<span class="text-slate-300 font-bold text-sm"><i class="fa-solid fa-medal"></i> 2</span>`;
        if (idx === 2) badge = `<span class="text-amber-700 font-bold text-sm"><i class="fa-solid fa-award"></i> 3</span>`;

        html += `
          <tr class="hover:bg-brand-dark/40">
            <td class="py-3 px-2">${badge}</td>
            <td class="py-3 px-2 font-bold text-sm">${item.team}</td>
            <td class="py-3 px-2 text-center text-gray-300">${item.postTotals.p1.toFixed(1)}</td>
            <td class="py-3 px-2 text-center text-gray-300">${item.postTotals.p2.toFixed(1)}</td>
            <td class="py-3 px-2 text-center text-gray-300">${item.postTotals.p3.toFixed(1)}</td>
            <td class="py-3 px-2 text-center text-gray-300">${item.postTotals.p4.toFixed(1)}</td>
            <td class="py-3 px-2 text-center text-gray-300">${item.postTotals.p5.toFixed(1)}</td>
            <td class="py-3 px-2 text-right font-black text-sm text-brand-gold">${item.total.toFixed(1)} Pkt</td>
          </tr>
        `;
      });

      html += `
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function renderSync(container) {
      const jsonStr = JSON.stringify(appData);
      const encodedData = encodeURIComponent(jsonStr);
      const currentUrl = window.location.origin + window.location.pathname + '?data=' + encodedData;

      let html = `
        <div class="space-y-6">
          <div class="glass-panel p-5 rounded-2xl border-l-4 border-cyan-400">
            <h2 class="text-2xl font-black text-cyan-300">Synchronisations-Zentrale</h2>
            <p class="text-xs text-cyan-100/80 mt-1">Übertrage Punkte ganz ohne Internet über Link-Teilen oder Text-Codes.</p>
          </div>

          <div class="glass-panel p-5 rounded-2xl border border-brand-gold/30">
            <h3 class="font-bold text-base text-brand-gold mb-2"><i class="fa-solid fa-share-nodes"></i> SCHRITT 1: EXPORT (Daten weitergeben)</h3>
            <p class="text-xs text-gray-300 mb-4">Kopiere den Direkt-Link oder den Text-Code und sende ihn per WhatsApp, Signal oder E-Mail an den Spielleiter.</p>

            <div class="space-y-3">
              <button onclick="copySyncLink('${currentUrl}')" class="w-full py-3 px-4 bg-brand-accent hover:bg-brand-green text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg">
                <i class="fa-solid fa-link"></i> Link mit allen Punkten kopieren
              </button>
              <button onclick="copyRawCode()" class="w-full py-3 px-4 bg-brand-dark hover:bg-black text-gray-200 font-bold rounded-xl text-xs flex items-center justify-center gap-2 border border-brand-gold/20 shadow-lg">
                <i class="fa-solid fa-code"></i> Text-Code kopieren
              </button>
            </div>
          </div>

          <div class="glass-panel p-5 rounded-2xl border border-emerald-500/40">
            <h3 class="font-bold text-base text-emerald-400 mb-2"><i class="fa-solid fa-file-import"></i> SCHRITT 2: IMPORT (Daten empfangen)</h3>
            <p class="text-xs text-gray-300 mb-4">Füge den erhaltenen Link oder Text-Code hier ein, um die Punkte zu übernehmen.</p>

            <div class="space-y-3">
              <textarea id="import-text-input" rows="4" placeholder="Füge hier den kopierten Link oder Text-Code ein..." class="w-full p-3 bg-brand-dark border border-brand-gold/30 rounded-xl text-xs text-white focus:outline-none focus:border-brand-gold"></textarea>
              <button onclick="processManualImport()" class="w-full py-3 gold-gradient font-bold rounded-xl text-xs text-brand-dark shadow-lg">
                Punkte aus Text/Link einlesen & zusammenführen
              </button>
            </div>
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function selectTeamForPosten(pKey, teamName) {
      selectedTeamForPosten[pKey] = teamName;
      render();
    }

    function setScore(pKey, qId, val) {
      const team = selectedTeamForPosten[pKey];
      if (!team) return;
      if (!appData.scores[team]) appData.scores[team] = {};
      if (!appData.scores[team][pKey]) appData.scores[team][pKey] = {};

      appData.scores[team][pKey][qId] = val;
      saveData();
      render();
    }

    function setMcAnswer(pKey, qId, letter, correctLetter) {
      const team = selectedTeamForPosten[pKey];
      if (!team) return;
      if (!appData.scores[team]) appData.scores[team] = {};
      if (!appData.scores[team][pKey]) appData.scores[team][pKey] = {};

      appData.scores[team][pKey][qId] = letter;
      saveData();
      render();
    }

    function promptAddTeam() {
      const name = prompt("Name der neuen Gruppe:");
      if (name && name.trim()) {
        const cleanName = name.trim();
        if (!appData.teams.includes(cleanName)) {
          appData.teams.push(cleanName);
          appData.scores[cleanName] = {};
          saveData();
          render();
        } else {
          alert("Dieses Team existiert bereits!");
        }
      }
    }

    function confirmDeleteTeam(teamName) {
      if (confirm(`Möchtest du das Team "${teamName}" wirklich löschen?`)) {
        appData.teams = appData.teams.filter(t => t !== teamName);
        delete appData.scores[teamName];
        saveData();
        render();
      }
    }

    function openMergeModal() {
      if (appData.teams.length < 2) {
        return alert("Es sind nicht genügend Teams zum Zusammenfassen vorhanden.");
      }
      document.getElementById('merge-target-name').value = '';
      const container = document.getElementById('merge-checkboxes-container');
      container.innerHTML = appData.teams.map(t => `
        <label class="flex items-center gap-3 text-xs text-gray-200 cursor-pointer p-1 hover:bg-brand-dark/40 rounded">
          <input type="checkbox" name="merge-team-cb" value="${t}" class="w-4 h-4 accent-brand-gold rounded">
          <span class="font-medium">${t}</span>
        </label>
      `).join('');
      document.getElementById('merge-modal').classList.remove('hidden');
    }

    function closeMergeModal() {
      document.getElementById('merge-modal').classList.add('hidden');
    }

    function executeMergeTeams() {
      const targetName = document.getElementById('merge-target-name').value.trim();
      if (!targetName) {
        return alert("Bitte gib einen Namen für das Ziel-Team ein.");
      }

      const checkboxes = document.querySelectorAll('input[name="merge-team-cb"]:checked');
      const teamsToMerge = Array.from(checkboxes).map(cb => cb.value);

      if (teamsToMerge.length === 0) {
        return alert("Bitte wähle mindestens ein Team zum Zusammenfassen aus.");
      }

      if (!appData.teams.includes(targetName)) {
        appData.teams.push(targetName);
      }
      if (!appData.scores[targetName]) {
        appData.scores[targetName] = {};
      }

      teamsToMerge.forEach(srcTeam => {
        if (srcTeam === targetName) return;
        if (appData.scores[srcTeam]) {
          Object.keys(appData.scores[srcTeam]).forEach(pKey => {
            if (!appData.scores[targetName][pKey]) {
              appData.scores[targetName][pKey] = {};
            }
            Object.assign(appData.scores[targetName][pKey], appData.scores[srcTeam][pKey]);
          });
        }
        appData.teams = appData.teams.filter(t => t !== srcTeam);
        delete appData.scores[srcTeam];
      });

      saveData();
      closeMergeModal();
      alert(`Teams erfolgreich unter "${targetName}" zusammengefasst!`);
      render();
    }

    function copySyncLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert("Direkt-Link in Zwischenablage kopiert!");
      }).catch(() => {
        alert("Fehler beim Kopieren.");
      });
    }

    function copyRawCode() {
      const str = JSON.stringify(appData);
      navigator.clipboard.writeText(str).then(() => {
        alert("Text-Code in Zwischenablage kopiert!");
      });
    }

    function processManualImport() {
      const input = document.getElementById('import-text-input').value.trim();
      if (!input) return alert("Bitte füge zuerst einen Code oder Link ein.");

      try {
        let rawJson = input;
        if (input.includes('?data=')) {
          const parts = input.split('?data=');
          rawJson = decodeURIComponent(parts[1].split('&')[0]);
        }
        const importedData = JSON.parse(rawJson);
        mergeData(importedData);
      } catch (e) {
        alert("Ungültiger Code oder Link! Bitte überprüfe die Eingabe.");
      }
    }

    function mergeData(imported) {
      if (!imported || !imported.teams || !imported.scores) return alert("Ungültiges Datenformat!");

      imported.teams.forEach(t => {
        if (!appData.teams.includes(t)) appData.teams.push(t);
        if (!appData.scores[t]) appData.scores[t] = {};
      });

      Object.keys(imported.scores).forEach(team => {
        if (!appData.scores[team]) appData.scores[team] = {};
        Object.keys(imported.scores[team]).forEach(pKey => {
          if (!appData.scores[team][pKey]) appData.scores[team][pKey] = {};
          Object.assign(appData.scores[team][pKey], imported.scores[team][pKey]);
        });
      });

      saveData();
      alert("Punkte erfolgreich synchronisiert!");
      switchTab('spielleiter');
    }

    function checkUrlParamsForData() {
      const params = new URLSearchParams(window.location.search);
      const dataParam = params.get('data');
      if (dataParam) {
        try {
          const imported = JSON.parse(decodeURIComponent(dataParam));
          if (confirm("Punkte aus dem Link importieren?")) {
            mergeData(imported);
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch (e) {}
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      checkUrlParamsForData();
      render();
    });
  </script>
</body>
</html>
